name: Publish to npm
# Publishes @stealthbridge/sdk when a vX.Y.Z tag matching package.json is
# pushed. Runs the full verification suite first and publishes with npm
# provenance (OIDC). Requires the NPM_TOKEN secret in the protected
# `npm-release` environment.
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
  id-token: write
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/fixtures/next-app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Tag must equal package.json version
        run: npm run check:version
      - run: npm run verify
      - name: Skip if this version is already on npm
        id: published
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@stealthbridge/sdk@${VERSION}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "@stealthbridge/sdk@${VERSION} is already published; nothing to do."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish with provenance
        if: steps.published.outputs.already == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
